const MAXH = 3;
function hintPattern(word, shown) {
  let idx = 0;
  return Array.from(word).map(ch => {
    if (ch === " ") return "/";
    if (isLetter(ch)) { const out = idx < shown ? ch.toUpperCase() : "_"; idx++; return out; }
    return ch;
  }).join(" ");
}

function hintFor(item, mode, lvl) {
  if (!lvl) return null;
  if (mode === "cap") {
    const n = letterCount(item.cap);
    return { pattern: hintPattern(item.cap, lvl) + " (" + n + (n === 1 ? " literă)" : " litere)"), cap: null };
  }
  const n = letterCount(item.name);
  return { pattern: hintPattern(item.name, lvl >= 3 ? 2 : 1) + " (" + n + (n === 1 ? " literă)" : " litere)"), cap: lvl >= 2 ? item.cap : null };
}

function mainPart(f) {
  const g = f.geometry;
  if (!g || g.type === "Polygon") return f;
  let best = null, ba = -1;
  g.coordinates.forEach(c => { const poly = { type: "Polygon", coordinates: c }; const a = d3.geoArea(poly); if (a > ba) { ba = a; best = poly; } });
  return best || f;
}

function relax(pts, r) {
  const p = pts.map(q => [q[0], q[1]]);
  const min = r * 2 + 4;
  for (let it = 0; it < 50; it++) {
    let moved = false;
    for (let i = 0; i < p.length; i++) for (let j = i + 1; j < p.length; j++) {
      let dx = p[j][0] - p[i][0], dy = p[j][1] - p[i][1], d = Math.hypot(dx, dy);
      if (d < min) {
        if (d < 0.01) { dx = (j - i) * 0.7; dy = 0.5; d = Math.hypot(dx, dy); }
        const push = (min - d) / 2, ux = dx / d, uy = dy / d;
        p[i][0] -= ux * push; p[i][1] -= uy * push; p[j][0] += ux * push; p[j][1] += uy * push; moved = true;
      }
    }
    if (!moved) break;
  }
  return p.map((q, i) => [q[0] - pts[i][0], q[1] - pts[i][1]]);
}

let worldPromise = null;
function buildWorld(fc) {
  const byId = new Map(), byName = new Map();
  fc.features.forEach(f => {
    if (f.id != null) byId.set(String(f.id).padStart(3, "0"), f);
    if (f.properties && f.properties.name) byName.set(f.properties.name, f);
  });
  const a2Feat = new Map(), featA2 = new Map();
  COUNTRIES.forEach(c => {
    const f = c.num === "XK" ? byName.get("Kosovo") : byId.get(c.num);
    if (f) { a2Feat.set(c.a2, f); featA2.set(f, c.a2); }
  });
  return { feats: fc.features, a2Feat, featA2 };
}
function loadWorld() {
  if (worldPromise) return worldPromise;
  worldPromise = (async () => {
    let err = new Error("Nu s-au putut încărca datele hărții");
    for (const u of WORLD_URLS) {
      try {
        const r = await fetch(u);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const topo = await r.json();
        return buildWorld(topojson.feature(topo, topo.objects.countries));
      } catch (e) { err = e; }
    }
    throw err;
  })();
  worldPromise.catch(() => { worldPromise = null; });
  return worldPromise;
}
function useWorld(enabled) {
  const [s, set] = useState({ status: enabled ? "loading" : "idle", data: null });
  const [n, setN] = useState(0);
  useEffect(() => {
    if (!enabled) return undefined;
    let alive = true;
    set({ status: "loading", data: null });
    loadWorld().then(d => alive && set({ status: "ready", data: d })).catch(() => alive && set({ status: "error", data: null }));
    return () => { alive = false; };
  }, [enabled, n]);
  return { status: s.status, data: s.data, retry: () => setN(x => x + 1) };
}

function reducer(s, a) {
  switch (a.t) {
    case "input": return { ...s, vals: { ...s.vals, [a.id]: a.v }, status: s.status[a.id] === "wrong" ? { ...s.status, [a.id]: "idle" } : s.status };
    case "ok": return { ...s, vals: { ...s.vals, [a.id]: a.v }, status: { ...s.status, [a.id]: "ok" } };
    case "bad": return { ...s, status: { ...s.status, [a.id]: "wrong" }, tries: { ...s.tries, [a.id]: (s.tries[a.id] || 0) + 1 }, tick: { ...s.tick, [a.id]: (s.tick[a.id] || 0) + 1 } };
    case "hint": return { ...s, hints: { ...s.hints, [a.id]: Math.min(MAXH, (s.hints[a.id] || 0) + 1) }, hintClicks: (s.hints[a.id] || 0) >= MAXH ? s.hintClicks : s.hintClicks + 1 };
    case "focus": return s.focus === a.id ? s : { ...s, focus: a.id };
    case "finish": return s.finished ? { ...s, summary: true } : { ...s, finished: true, final: a.time, summary: true };
    case "summary": return { ...s, summary: a.v };
    default: return s;
  }
}

function AnswerField({ item, idx, mode, st, api }) {
  const id = item.a2;
  const solved = st.status[id] === "ok";
  const status = st.finished && !solved ? "miss" : (st.status[id] || "idle");
  const lvl = st.hints[id] || 0;
  const locked = solved || st.finished;
  const answer = mode === "cap" ? item.cap : item.name;
  const shown = st.finished && !solved ? answer : (st.vals[id] || "");
  const ref = useRef(null);
  const hint = hintFor(item, mode, lvl);
  useEffect(() => { api.reg(id, ref.current); return () => api.reg(id, null); }, [id]);
  const tick = st.tick[id] || 0;
  useEffect(() => {
    if (!tick || !ref.current) return;
    const el = ref.current;
    el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  }, [tick]);
  const onKey = e => {
    if (e.key === "Enter") { e.preventDefault(); api.commit(id, true); }
    else if (e.key === "ArrowDown") { e.preventDefault(); api.step(id, 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); api.step(id, -1); }
  };
  return html`<div className="af" data-s=${status}>
    <div className="af-line">
      <input ref=${ref} className="nb-input" type="text" value=${shown} disabled=${locked}
        placeholder=${mode === "cap" ? "Scrie capitala..." : "Scrie țara..."}
        autoComplete="off" autoCapitalize="none" autoCorrect="off" spellCheck=${false}
        aria-label=${"Răspuns " + (idx + 1)}
        onChange=${e => api.change(id, e.target.value)} onKeyDown=${onKey}
        onBlur=${() => api.commit(id, false)} onFocus=${() => api.focus(id)} />
      ${solved ? html`<span className="chk" title="Corect"><${Icon} n="check" s=${22} w=${3.5} /></span>` : null}
      <button type="button" className="nb-btn hint-btn" disabled=${locked || lvl >= MAXH} title="Indiciu"
        onMouseDown=${e => e.preventDefault()} onClick=${() => api.hint(id)}>
        <${Icon} n="help" s=${16} /><span className="hint-lbl">Indiciu</span>
      </button>
    </div>
    <div className="af-sub">
      ${status === "wrong" ? html`<span className="tag bad">Mai încearcă!</span>` : null}
      ${hint && !solved && !st.finished ? html`<span className="tag hint">${hint.pattern}</span>` : null}
      ${hint && hint.cap && !solved && !st.finished ? html`<span className="tag cap">Capitală: ${hint.cap}</span>` : null}
      ${solved && lvl > 0 ? html`<span className="tag used">Cu indiciu</span>` : null}
    </div>
  </div>`;
}

function Row({ item, idx, mode, st, api }) {

function QCard({ item, idx, mode, st, api }) {

const Shapes = React.memo(function Shapes({ shapes, status, focus, finished, onPin }) {
  const ctx = [], tg = [];
  shapes.forEach(s => (s.a2 ? tg : ctx).push(s));
  tg.sort((a, b) => (a.a2 === focus) - (b.a2 === focus));
  return html`<g>
    ${ctx.map(s => html`<path key=${s.k} d=${s.d} fill="#D9D2C3" stroke="#000" strokeWidth="1.5" strokeLinejoin="round" vectorEffect="non-scaling-stroke" />`)}
    ${tg.map(s => {
      const ok = status[s.a2] === "ok", f = s.a2 === focus;
      const fill = ok ? "#22C55E" : f ? "#3B82F6" : finished ? "#FF5C5C" : "#FFDE00";
      return html`<path key=${s.k} d=${s.d} fill=${fill} stroke="#000" strokeWidth=${f ? 2.75 : 1.5} strokeLinejoin="round" vectorEffect="non-scaling-stroke" style=${{ cursor: "pointer" }} onClick=${() => onPin(s.a2)} />`;
    })}
  </g>`;
});

function MapPanel({ cont, targets, st, world, onPin }) {
  const wrap = useRef(null), svg = useRef(null), zoom = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });
  const [tf, setTf] = useState({ x: 0, y: 0, k: 1 });

  useEffect(() => {
    const ro = new ResizeObserver(es => { const r = es[0].contentRect; setSize({ w: Math.round(r.width), h: Math.round(r.height) }); });
    ro.observe(wrap.current);
    return () => ro.disconnect();
  }, []);
  useEffect(() => {
    if (!size.w || !size.h) return undefined;
    const sel = d3.select(svg.current);
    const z = d3.zoom().scaleExtent([1, 80])
      .extent([[0, 0], [size.w, size.h]])
      .translateExtent([[-size.w * 0.3, -size.h * 0.3], [size.w * 1.3, size.h * 1.3]])
      .on("zoom", e => setTf({ x: e.transform.x, y: e.transform.y, k: e.transform.k }));
    sel.call(z);
    zoom.current = z;
    return () => { sel.on(".zoom", null); };
  }, [size.w, size.h]);

  const geo = useMemo(() => {
    if (!size.w || !size.h) return null;
    const cfg = CONT[cont], proj = cfg.proj(), pad = 14;
    proj.fitExtent([[pad, pad], [size.w - pad, size.h - pad]], { type: "MultiPoint", coordinates: cfg.pts });
    const path = d3.geoPath(proj), m = 0.4, tset = new Set(targets.map(t => t.a2)), shapes = [];
    world.feats.forEach(f => {
      if (f.id === "010") return;
      const b = path.bounds(f);
      if (!(b[1][0] > -size.w * m && b[0][0] < size.w * (1 + m) && b[1][1] > -size.h * m && b[0][1] < size.h * (1 + m))) return;
      const d = path(f);
      if (!d) return;
      const a2 = world.featA2.get(f);
      const isT = a2 && tset.has(a2);
      shapes.push({ k: isT ? a2 : "c" + shapes.length, a2: isT ? a2 : null, d });
    });
    const pins = [];
    targets.forEach(t => {
      const p = PIN_OVERRIDE[t.a2] ? proj(PIN_OVERRIDE[t.a2]) : path.centroid(mainPart(world.a2Feat.get(t.a2)));
      if (p && isFinite(p[0]) && isFinite(p[1])) pins.push({ a2: t.a2, x: p[0], y: p[1] });
    });
    return { shapes, pins };
  }, [size.w, size.h, cont, world, targets]);

  const offs = useMemo(() => geo ? relax(geo.pins.map(p => [p.x * tf.k, p.y * tf.k]), PIN_R) : [], [geo, tf.k]);
  const numOf = useMemo(() => { const o = {}; targets.forEach((t, i) => { o[t.a2] = i + 1; }); return o; }, [targets]);

  const zoomBy = f => d3.select(svg.current).transition().duration(250).call(zoom.current.scaleBy, f);
  const zoomReset = () => d3.select(svg.current).transition().duration(300).call(zoom.current.transform, d3.zoomIdentity);

  let leaders = null, pinEls = null;
  if (geo) {
    leaders = []; pinEls = [];
    geo.pins.forEach((p, i) => {
      const o = offs[i] || [0, 0];
      const sx = tf.k * p.x + tf.x, sy = tf.k * p.y + tf.y, px = sx + o[0], py = sy + o[1];
      if (px < -30 || py < -30 || px > size.w + 30 || py > size.h + 30) return;
      const ok = st.status[p.a2] === "ok", f = st.focus === p.a2;
      const fill = ok ? "#22C55E" : f ? "#3B82F6" : st.finished ? "#FF5C5C" : "#FFDE00";
      if (Math.hypot(o[0], o[1]) > 5) {
        leaders.push(html`<g key=${"l" + p.a2}><line x1=${sx} y1=${sy} x2=${px} y2=${py} stroke="#000" strokeWidth="2" /><circle cx=${sx} cy=${sy} r="3.5" fill="#000" /></g>`);
      }
      pinEls.push(html`<g key=${"p" + p.a2} transform=${"translate(" + px + "," + py + ")"} style=${{ cursor: "pointer" }} onClick=${() => onPin(p.a2)}>
        <rect x=${-PIN_R + 2.5} y=${-PIN_R + 2.5} width=${PIN_R * 2} height=${PIN_R * 2} fill="#000" />
        <rect x=${-PIN_R} y=${-PIN_R} width=${PIN_R * 2} height=${PIN_R * 2} fill=${fill} stroke="#000" strokeWidth="2.5" />
        <text x="0" y="0.5" textAnchor="middle" dominantBaseline="central" fontFamily="Space Mono, monospace" fontWeight="700" fontSize="12" fill=${f && !ok ? "#fff" : "#000"} style=${{ userSelect: "none", pointerEvents: "none" }}>${numOf[p.a2]}</text>
      </g>`);
    });
  }

  return html`<div ref=${wrap} className="mapwrap">
    <svg ref=${svg} className="mapsvg" width=${size.w} height=${size.h} style=${{ touchAction: "none" }} role="img" aria-label="Hartă interactivă">
      <rect width=${size.w} height=${size.h} fill="#DCE8FB" />
      ${geo ? html`<g transform=${"translate(" + tf.x + "," + tf.y + ") scale(" + tf.k + ")"}>
        <${Shapes} shapes=${geo.shapes} status=${st.status} focus=${st.focus} finished=${st.finished} onPin=${onPin} /></g>` : null}
      ${geo ? html`<g>${leaders}${pinEls}</g>` : null}
    </svg>
    <div className="zoomctl">
      <button type="button" className="nb-btn zbtn" title="Mărește" aria-label="Mărește" onClick=${() => zoomBy(1.7)}><${Icon} n="plus" s=${20} /></button>
      <button type="button" className="nb-btn zbtn" title="Micșorează" aria-label="Micșorează" onClick=${() => zoomBy(1 / 1.7)}><${Icon} n="minus" s=${20} /></button>
      <button type="button" className="nb-btn zbtn y" title="Resetează zoom" aria-label="Resetează zoom" onClick=${zoomReset}><${Icon} n="fit" s=${19} /></button>
    </div>
    <div className="legend">
      <span><i style=${{ background: "#FFDE00" }}></i>De ghicit</span>
      <span><i style=${{ background: "#3B82F6" }}></i>Selectat</span>
      <span><i style=${{ background: "#22C55E" }}></i>Rezolvat</span>
    </div>
  </div>`;
}

function Summary({ quiz, targets, st, mode, onClose, onAgain, onExit }) {
  const n = targets.length;
  const rows = targets.map(t => ({ t, ok: st.status[t.a2] === "ok", h: st.hints[t.a2] || 0, tries: st.tries[t.a2] || 0 }));
  const solved = rows.filter(r => r.ok).length;
  const pts = rows.reduce((a, r) => a + pointsFor(r.ok, r.h), 0);
  const acc = n ? Math.round(pts / n * 100) : 0;
  const hintsUsed = rows.reduce((a, r) => a + r.h, 0);
  const wrongTotal = rows.reduce((a, r) => a + r.tries, 0);
  const missed = rows.filter(r => !r.ok), hinted = rows.filter(r => r.ok && r.h > 0);
  const verdict = acc >= 95 ? "Impecabil!" : acc >= 80 ? "Foarte bine!" : acc >= 60 ? "Bine. Mai exersează puțin." : acc >= 30 ? "Mai ai de învățat." : "Începutul e greu. Încearcă din nou!";
  const nameOf = t => (mode === "cap" ? t.cap : t.name);
  return html`<div className="overlay" role="dialog" aria-modal="true" aria-label="Rezultat final">
    <div className="modal">
      <div className="modal-h">
        <h2 style=${{ display: "flex", alignItems: "center", gap: ".6rem" }}><${Icon} n="trophy" s=${26} /> Rezultat final</h2>
        <button type="button" className="nb-btn sm" onClick=${onClose} aria-label="Închide"><${Icon} n="x" s=${16} /> Închide</button>
      </div>
      <div style=${{ padding: "1rem 1rem 0" }}>
        <div className="badge k" style=${{ marginBottom: ".4rem" }}>${quiz.title}</div>
        <h3 style=${{ fontSize: "1.6rem", lineHeight: 1.1 }}>${verdict}</h3>
      </div>
      <div className="kpis">
        <div className="kpi b"><small>Scor final</small><b>${acc}%</b><em>${solved} / ${n} corecte · ${fmtPts(pts)} puncte</em></div>
        <div className="kpi m"><small>Timp total</small><b>${mmss(st.final)}</b><em>${wrongTotal} încercări greșite</em></div>
        <div className="kpi c"><small>Indicii folosite</small><b>${hintsUsed}</b><em>${hinted.length} răspunsuri „Cu indiciu”</em></div>
      </div>
      ${missed.length ? html`<div className="modal-sec"><h3>Ratate (${missed.length})</h3>
        <div className="chips">${missed.map(r => html`<div key=${r.t.a2} className="chip bad">${r.t.name}<small>Capitala: ${r.t.cap}</small></div>`)}</div></div>` : null}
      ${hinted.length ? html`<div className="modal-sec"><h3>Cu indiciu (${hinted.length})</h3>
        <div className="chips">${hinted.map(r => html`<div key=${r.t.a2} className="chip hint">${nameOf(r.t)}<small>${r.h} ${r.h === 1 ? "indiciu" : "indicii"}</small></div>`)}</div></div>` : null}
      ${!missed.length && !hinted.length ? html`<div className="modal-sec"><div className="chip" style=${{ background: "var(--mint)" }}>Toate răspunsurile au fost corecte, fără indicii.</div></div>` : null}
      <div className="modal-f">
        <button type="button" className="nb-btn y" onClick=${onAgain}><${Icon} n="reset" s=${16} /> Joacă din nou</button>
        <button type="button" className="nb-btn k" onClick=${onExit}><${Icon} n="grid" s=${16} /> Alege alt quiz</button>
        <button type="button" className="nb-btn" onClick=${onClose}>Revizuiește răspunsurile</button>
      </div>
    </div>
  </div>`;
}

function Run({ quiz, pool, count, opts, auto, onAuto, onCount, onReset, onExit, world }) {
  const mode = quiz.type;
  const [targets] = useState(() => shuffle(pool).slice(0, count));
  const [st, dispatch] = useReducer(reducer, null, () => ({ vals: {}, status: {}, hints: {}, tries: {}, tick: {}, hintClicks: 0, focus: targets[0].a2, finished: false, final: 0, summary: false }));
  const stRef = useRef(st); stRef.current = st;
  const autoRef = useRef(auto); autoRef.current = auto;
  const refs = useRef({});
  const startRef = useRef(Date.now());
  const [now, setNow] = useState(Date.now());
  const byId = useMemo(() => Object.fromEntries(targets.map(t => [t.a2, t])), [targets]);
  const answerOf = it => (mode === "cap" ? it.cap : it.name);
  const isMatch = (it, v) => { const k = key(v); return !!k && (mode === "cap" ? it.kK : it.kC).includes(k); };

  useEffect(() => {
    if (st.finished) return undefined;
    const t = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(t);
  }, [st.finished]);
  const elapsed = st.finished ? st.final : now - startRef.current;
  const solvedCount = targets.filter(t => st.status[t.a2] === "ok").length;

  useEffect(() => {
    if (st.finished || solvedCount !== targets.length) return undefined;
    const t = setTimeout(() => dispatch({ t: "finish", time: Date.now() - startRef.current }), 700);
    return () => clearTimeout(t);
  }, [solvedCount, st.finished]);

  useEffect(() => {
    if (window.matchMedia("(min-width:1024px)").matches && refs.current[targets[0].a2]) refs.current[targets[0].a2].focus();
  }, []);

  const focusInput = id => {
    const el = refs.current[id];
    const row = document.getElementById("row-" + id);
    if (row) row.scrollIntoView({ block: "nearest", behavior: "smooth" });
    if (el && !el.disabled) el.focus();
  };
  const advance = id => {
    const order = targets.map(t => t.a2), i = order.indexOf(id);
    for (let d = 1; d < order.length; d++) {
      const nid = order[(i + d) % order.length];
      if (stRef.current.status[nid] !== "ok") { dispatch({ t: "focus", id: nid }); setTimeout(() => focusInput(nid), 0); return; }
    }
  };
  const solve = (id, adv) => { dispatch({ t: "ok", id, v: answerOf(byId[id]) }); if (adv) advance(id); };
  const api = {
    reg: (id, el) => { if (el) refs.current[id] = el; else delete refs.current[id]; },
    focus: id => dispatch({ t: "focus", id }),
    change: (id, v) => {
      if (stRef.current.finished || stRef.current.status[id] === "ok") return;
      dispatch({ t: "input", id, v });
      if (autoRef.current && isMatch(byId[id], v)) solve(id, true);
    },
    commit: (id, adv) => {
      const s = stRef.current;
      if (s.finished || s.status[id] === "ok") return;
      const v = s.vals[id] || "";
      if (!v.trim()) return;
      if (isMatch(byId[id], v)) solve(id, adv); else dispatch({ t: "bad", id });
    },
    hint: id => { if (!stRef.current.finished && stRef.current.status[id] !== "ok") dispatch({ t: "hint", id }); },
    pin: id => { dispatch({ t: "focus", id }); focusInput(id); },
    step: (id, dir) => {
      const order = targets.map(t => t.a2), i = order.indexOf(id);
      for (let d = 1; d < order.length; d++) {
        const nid = order[(i + dir * d + order.length * 2) % order.length];
        if (stRef.current.status[nid] !== "ok") { dispatch({ t: "focus", id: nid }); focusInput(nid); return; }
      }
    }
  };
  const pinRef = useRef(api.pin); pinRef.current = api.pin;
  const stablePin = useCallback(id => pinRef.current(id), []);
  const finish = () => dispatch({ t: "finish", time: Date.now() - startRef.current });
  const unit = TYPE_META[mode].one;

  return html`<div className="mx-auto w-full max-w-[1500px] px-3 sm:px-6 py-4">
    <header className="nb-panel hud">
      <div className="hud-l">
        <button type="button" className="nb-btn" onClick=${onExit}><${Icon} n="back" s=${17} /> Înapoi</button>
        <h1 className="hud-title">${quiz.title}</h1>
      </div>
      <div className="hud-r">
        <div className="timer mono" role="timer" aria-label="Cronometru"><${Icon} n="clock" s=${20} /> ${mmss(elapsed)}</div>
        <div className="score mono">${solvedCount} / ${targets.length}<span>Corecte</span></div>
        <button type="button" className="nb-btn" onClick=${onReset}><${Icon} n="reset" s=${16} /> Resetează</button>
        <button type="button" className="nb-btn y" onClick=${st.finished ? () => dispatch({ t: "summary", v: true }) : finish}><${Icon} n="done" s=${16} /> ${st.finished ? "Rezultat" : "Finalizează"}</button>
      </div>
      <div className="hud-opts">
        <span className="opt-lbl">Număr:</span>
        <div className="seg" role="group" aria-label="Număr de elemente">
          ${opts.map(o => html`<button key=${o} type="button" aria-pressed=${o === count} onClick=${() => o !== count && onCount(o)}>${o === opts[opts.length - 1] ? "Toate" : o + " " + unit}</button>`)}
        </div>
        <button type="button" role="switch" aria-checked=${auto} className="sw" onClick=${() => onAuto(!auto)}>
          <i>${auto ? html`<${Icon} n="check" s=${16} w=${3.5} />` : null}</i> Auto-validare
        </button>
        <span className="opt-lbl" style=${{ marginLeft: "auto", textTransform: "none", letterSpacing: 0, fontWeight: 500 }}>Enter validează · ↑↓ schimbă câmpul</span>
      </div>
    </header>

    ${mode === "map"
      ? html`<div className="grid gap-5 lg:grid-cols-[3fr_2fr] mt-6 items-start">
          <div className="nb-panel map-col"><${MapPanel} cont=${quiz.cont} targets=${targets} st=${st} world=${world} onPin=${stablePin} /></div>
          <section className="nb-panel sheet">
            <div className="sheet-h"><span>Fișă de răspunsuri</span><span className="mono">${solvedCount}/${targets.length}</span></div>
            <div className="sheet-list">${targets.map((t, i) => html`<${Row} key=${t.a2} item=${t} idx=${i} mode=${mode} st=${st} api=${api} />`)}</div>
          </section>
        </div>`
      : html`<div className="qgrid">${targets.map((t, i) => html`<${QCard} key=${t.a2} item=${t} idx=${i} mode=${mode} st=${st} api=${api} />`)}</div>`}

    <${BackTop} />

    ${st.summary ? html`<${Summary} quiz=${quiz} targets=${targets} st=${st} mode=${mode} onClose=${() => dispatch({ t: "summary", v: false })} onAgain=${onReset} onExit=${onExit} />` : null}
  </div>`;
}

function QuizView({ quiz, onExit }) {
  const isMap = quiz.type === "map";
  const w = useWorld(isMap);
  const pool = useMemo(() => isMap && w.data ? quiz.items.filter(c => w.data.a2Feat.has(c.a2)) : quiz.items, [quiz, w.data]);
  const total = pool.length;
  const [pref, setPref] = useState(null);
  const [auto, setAuto] = useState(true);
  const [round, setRound] = useState(0);
  const count = Math.min(pref == null ? (total <= 20 ? total : 20) : pref, total);
  const opts = [10, 20, total].filter((n, i, a) => n <= total && a.indexOf(n) === i);

  if (isMap && w.status !== "ready") {
    return html`<div className="mx-auto max-w-[900px] px-3 sm:px-6 py-10">
      <div className="nb-panel loader">
        ${w.status === "error"
          ? html`<h2 style=${{ fontSize: "1.6rem", textTransform: "uppercase" }}>Harta nu s-a putut încărca</h2>
              <p style=${{ maxWidth: "30rem", margin: 0 }}>Verifică conexiunea la internet (datele geografice vin de pe jsDelivr) și încearcă din nou.</p>
              <div style=${{ display: "flex", gap: ".8rem", flexWrap: "wrap", justifyContent: "center" }}>
                <button type="button" className="nb-btn y" onClick=${w.retry}><${Icon} n="reset" s=${16} /> Reîncearcă</button>
                <button type="button" className="nb-btn" onClick=${onExit}><${Icon} n="back" s=${16} /> Înapoi</button>
              </div>`
          : html`<h2 style=${{ fontSize: "1.6rem", textTransform: "uppercase" }}>Se încarcă harta…</h2><div className="bar"></div>`}
      </div>
    </div>`;
  }
  return html`<${Run} key=${count + "-" + round} quiz=${quiz} pool=${pool} count=${count} opts=${opts} auto=${auto}
    onAuto=${setAuto} onCount=${setPref} onReset=${() => setRound(r => r + 1)} onExit=${onExit} world=${w.data} />`;
}

function Home({ onStart }) {
  const [tab, setTab] = useState("all");
  const tabs = [["all", "Toate"], ["map", "Hărți"], ["flag", "Steaguri"], ["cap", "Capitale"]];
  const list = QUIZZES.filter(q => tab === "all" || q.type === tab);
  const countOf = k => k === "all" ? QUIZZES.length : QUIZZES.filter(q => q.type === k).length;
  return html`<div className="mx-auto w-full max-w-[1200px] px-3 sm:px-6 py-6">
    <section className="nb-panel hero" aria-label="GEO//BRUT">
      <div>
        <h1>GEO<i>//</i>BRUT</h1>
      </div>
      <div style=${{ display: "flex", gap: ".8rem", flexWrap: "wrap" }}>
        <div className="stat"><b>${COUNTRIES.length}</b><span>Țări</span></div>
        <div className="stat"><b>${QUIZZES.filter(q => q.type === "map").length}</b><span>Hărți</span></div>
        <div className="stat"><b>${QUIZZES.length}</b><span>Teste</span></div>
      </div>
    </section>

    <nav className="tabs" style=${{ margin: "1.8rem 0 1.4rem" }} aria-label="Categorii">
      ${tabs.map(([k, label]) => html`<button key=${k} type="button" className="tab" aria-pressed=${tab === k} onClick=${() => setTab(k)}>${label}<span className="mono" style=${{ opacity: .7 }}>${countOf(k)}</span></button>`)}
    </nav>

    <div className="qgrid-home">
      ${list.map(q => {
        const m = TYPE_META[q.type];
        const sample = q.type === "flag" ? shuffle(q.items).slice(0, 4) : [];
        return html`<article key=${q.id} className="nb-card qcard nb-press" tabIndex="-1" onClick=${() => onStart(q)}>
          <div className="qcard-top" style=${{ background: m.color, color: m.fg }}>
            <span style=${{ display: "inline-flex", alignItems: "center", gap: ".45rem" }}><${Icon} n=${m.icon} s=${16} /> ${m.label}</span>
          </div>
          <div className="qcard-body">
            <h3>${q.title}</h3>
            <div className="qcard-meta">
              <span className="bignum">${q.items.length}</span>
              <span className="badge">${m.unit}</span>
            </div>
            ${sample.length ? html`<div className="flagstrip" aria-hidden="true">${sample.map(c => html`<span key=${c.a2}><img src=${flagUrl(c.a2)} alt="" loading="lazy" draggable=${false} onError=${e => { e.target.style.display = "none"; }} /></span>`)}</div>` : null}
            <button type="button" className="nb-btn go">ÎNCEPE TESTUL <${Icon} n="next" s=${18} /></button>
          </div>
        </article>`;
      })}
    </div>

    <${BackTop} />

    <footer className="foot">
      <span>Hărți: Natural Earth (world-atlas) · Steaguri: flagcdn.com</span>
      <span className="mono">Made by Amalia · GEO//BRUT</span>
    </footer>
  </div>`;
}

function App() {
  const [quiz, setQuiz] = useState(null);
  const exit = () => { setQuiz(null); window.scrollTo(0, 0); };
  const start = q => { setQuiz(q); window.scrollTo(0, 0); };
  return quiz ? html`<${QuizView} key=${quiz.id} quiz=${quiz} onExit=${exit} />` : html`<${Home} onStart=${start} />`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
